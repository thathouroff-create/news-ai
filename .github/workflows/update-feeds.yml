name: Fetch News Feeds

on:
  schedule:
    - cron: '13,43 * * * *' # Off-peak minutes to minimize GitHub Actions queue throttling
  repository_dispatch:
    types: [fetch-news]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies Safely
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Clone gh-pages branch & restore previous snapshot for cache reuse
        run: |
          git clone --branch gh-pages --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-dir
          if [ -f gh-pages-dir/data/latest.json ]; then
            mkdir -p data
            cp gh-pages-dir/data/latest.json data/latest.json
          fi

      - name: Fetch Feeds & Build v4.0 Snapshot
        run: node fetch-feeds.js

      - name: Commit data to gh-pages branch with rebase retry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cp -r data gh-pages-dir/
          cd gh-pages-dir
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Automated v4.0 feed update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3; do
            git pull --rebase origin gh-pages && git push origin gh-pages && break
            sleep 3
          done
