<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Ambient light orb -->
  <circle cx="160" cy="140" r="180" fill="url(#glowGrad)" filter="blur(30px)" opacity="0.6" />

  <!-- Inner News / Globe Tech Symbol -->
  <g filter="url(#dropShadow)" transform="translate(106, 106)">
    <!-- Modern Newspaper Card Backdrop -->
    <rect x="20" y="20" width="260" height="260" rx="36" fill="#ffffff" opacity="0.96" />
    
    <!-- Header accent bar -->
    <rect x="44" y="48" width="80" height="14" rx="7" fill="#2563eb" />
    <circle cx="240" cy="55" r="8" fill="#ef4444" />
    <circle cx="218" cy="55" r="8" fill="#eab308" />

    <!-- Main headline block -->
    <rect x="44" y="76" width="212" height="20" rx="6" fill="#0f172a" />
    <rect x="44" y="104" width="140" height="12" rx="5" fill="#64748b" />

    <!-- Image preview frame -->
    <rect x="44" y="132" width="100" height="70" rx="12" fill="url(#bgGrad)" />
    <!-- Pulse wave inside image frame -->
    <path d="M54 172 L70 156 L84 170 L104 148 L124 168 L134 160" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Text summary lines -->
    <rect x="156" y="136" width="100" height="10" rx="5" fill="#94a3b8" />
    <rect x="156" y="156" width="90" height="10" rx="5" fill="#cbd5e1" />
    <rect x="156" y="176" width="98" height="10" rx="5" fill="#cbd5e1" />
    <rect x="156" y="196" width="70" height="10" rx="5" fill="#e2e8f0" />

    <!-- Bottom interactive badge -->
    <rect x="44" y="222" width="120" height="26" rx="13" fill="#eff6ff" />
    <circle cx="58" cy="235" r="5" fill="#2563eb" />
    <rect x="72" y="231" width="74" height="8" rx="4" fill="#2563eb" />

    <rect x="194" y="222" width="62" height="26" rx="13" fill="#f1f5f9" />
    <rect x="206" y="231" width="38" height="8" rx="4" fill="#64748b" />
  </g>
</svg>
